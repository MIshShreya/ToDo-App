<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="todostyle.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h1>ToDo App</h1>
            
            <form class="input-area" id="task-form">
                <input type="text" id="task-input" placeholder="Add a new task...">
                <button type="submit" id="add-task-btn" aria-label="Add task">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>

            <div class="todo-container">
                <ul id="task-list"></ul>
                <img class="empty-image" src="https://i.pinimg.com/736x/0e/e6/aa/0ee6aa20d4eb72cfd559da513e6cef82.jpg" alt="Empty" width="200" height="200">
            </div>

            <button type="button" id="clear-all-btn" class="clear-btn">Clear All</button>
        </div>
    </div>

    <script src="todoscript.js"></script>
</body>
</html>
